<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风格展览柜 · 前端风格博物馆</title>
<meta name="description" content="30 种视觉风格渲染同一份落地页测试内容，卡片即缩略小样，点击对比。">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #16161c; color: #e8e8ee; min-height: 100vh;
  font-family: "Inter", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.7; padding-top: 38px;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(50% 35% at 80% 0%, rgba(125,211,252,.07), transparent 70%),
    radial-gradient(45% 35% at 10% 100%, rgba(192,132,252,.07), transparent 70%);
}
.wrap { max-width: 1160px; margin: 0 auto; padding: 74px 24px 60px; position: relative; }
.g-head { margin-bottom: 44px; }
.g-head .kicker {
  display: inline-block; font-size: 13px; letter-spacing: 3px; color: #7dd3fc;
  border: 1px solid rgba(125,211,252,.3); padding: 4px 14px; border-radius: 99px; margin-bottom: 16px;
}
.g-head h1 { font-size: clamp(30px, 4.6vw, 44px); line-height: 1.2; }
.g-head h1 span { color: #7dd3fc; }
.g-head p { color: #9a9aa8; max-width: 660px; margin-top: 12px; }
.g-head p b { color: #cfcfda; font-weight: 600; }
.g-switch { margin-top: 20px; font-size: 14px; }
.g-switch a { color: #c084fc; text-decoration: none; border-bottom: 1px dashed rgba(192,132,252,.5); padding-bottom: 1px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }

/* 风格卡片：用各主题变量渲染，卡片本身就是小样 */
.g-card {
  display: block; text-decoration: none;
  background: var(--bg); color: var(--text);
  border: 1px solid rgba(255,255,255,.09); border-radius: 16px; overflow: hidden;
  transition: transform .3s, border-color .3s, box-shadow .3s;
}
.g-card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: 0 18px 46px rgba(0,0,0,.45); }
.g-preview {
  padding: 26px 22px 22px; min-height: 168px;
  background: var(--bg-decor, var(--bg));
  border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 7px; justify-content: center;
}
.g-mini-title {
  font-family: var(--font-head); color: var(--text);
  font-size: 25px; font-weight: 700; line-height: 1.2;
  text-transform: var(--title-tt, none); letter-spacing: var(--title-ls, 0);
  background: var(--h1-grad, none); -webkit-background-clip: var(--h1-clip, border-box); background-clip: var(--h1-clip, border-box);
  -webkit-text-fill-color: var(--h1-fill, currentColor);
}
.g-mini-tag { font-family: var(--font-head); color: var(--accent); font-size: 13.5px; font-weight: 600; }
.g-mini-btn {
  align-self: flex-start; margin-top: 8px;
  font-size: 11.5px; font-weight: 600; font-family: var(--font-btn, var(--font-body));
  background: var(--accent); color: var(--on-accent, var(--bg));
  padding: 5px 14px; border-radius: var(--radius, 10px);
  text-transform: var(--btn-tt, none);
}
.g-mini-lines { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.g-mini-lines i { display: block; height: 6px; border-radius: var(--radius-sm, 3px); background: var(--surface-2); }
.g-info { padding: 16px 22px 18px; display: flex; align-items: center; gap: 14px; background: var(--surface); }
.g-names { flex: 1; min-width: 0; }
.g-names b { font-size: 15.5px; color: var(--text); font-family: var(--font-head); display: block; }
.g-names span { font-size: 12px; color: var(--text-2); display: block; margin-top: 1px; }
.g-dots { display: flex; gap: 6px; }
.g-dots i { width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(128,128,128,.35); }
.g-num {
  position: absolute; top: 12px; right: 14px; z-index: 2;
  font-size: 11.5px; font-weight: 700; color: var(--text-2);
  background: var(--surface); border: 1px solid var(--border);
  padding: 2px 9px; border-radius: var(--radius-sm, 99px);
}
.g-cell { position: relative; }
.g-foot { margin-top: 44px; color: #8a8a96; font-size: 13.5px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.g-foot a { color: #7dd3fc; text-decoration: none; }
@media (max-width: 640px) { .wrap { padding-top: 56px; } }
</style>
<style>
/*__MUSEUM_BAR_CSS__*/
</style>
<style>
/*__VAR_BLOCKS__*/
</style>
</head>
<body>
<div class="museum-bar">
  <a class="mb-logo" href="index.html">◈ 风格博物馆</a>
  <span class="mb-crumb">／<a href="styles.html">风格展览柜</a></span>
  <span class="mb-current">30 件展品</span>
  <a class="mb-other" href="layouts.html">布局展览柜 →</a>
</div>

<div class="wrap">
  <div class="g-head">
    <span class="kicker">STYLE CABINET · 风格展览柜</span>
    <h1>同一份落地页，<span>30 种视觉风格</span></h1>
    <p>所有页面渲染的都是<b>同一份测试内容</b>（l4place 个人落地页：项目、技能、文章均为 GitHub 真实数据，仅作业务测试用例）。<b>30 套皮肤换肤不换药</b>——卡片本身就是缩略小样，点进去看完整页面。风格展品配有可拖动的<b>视觉调色台</b>：色相、饱和度、对比度、文字比例、行高与圆角均可连续调节。</p>
    <p class="g-switch">想看排版实验？<a href="layouts.html">去布局展览柜 →</a></p>
  </div>
  <div class="grid">
<!--__CARDS__-->
  </div>
  <div class="g-foot">
    <p>© 2026 前端风格博物馆 · 风格展览柜 · 共 30 件</p>
    <p><a href="index.html">← 返回门户</a> · <a href="layouts.html">布局展览柜 →</a></p>
  </div>
</div>
</body>
</html>
